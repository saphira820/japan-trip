<style>

a:not(.btn){color:var(--acc)}input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",Roboto,sans-serif}
body{max-width:640px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;background:var(--bg);padding:6px 0}
.tabs button,.chip{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 4px;border-radius:10px;font:inherit}
.tabs button.on,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip{flex:none;padding:5px 12px;border-radius:20px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input.n{width:64px}textarea{width:100%;min-height:54px}
.card{background:#eef7f5;border:1px solid #c3dcd7;border-left:6px solid var(--acc);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,116,104,.14)}.bak .card{border-left-color:#8bbab3}
.card.drag{opacity:.6;border-color:var(--acc)}
.hd{display:flex;gap:8px;align-items:center}
.hd .t{flex:1;min-width:0}.time{font-weight:700;color:var(--tm);font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:13px}
.h{touch-action:none;cursor:grab;font-size:22px;color:var(--mut);padding:6px 10px;user-select:none;-webkit-user-select:none}.ta{box-shadow:0 4px 0 var(--acc)}.tb{box-shadow:0 -4px 0 var(--acc)}.tz{outline:2px dashed var(--acc)}.note{white-space:pre-wrap;font-size:13px;color:var(--mut)}textarea{overflow:hidden;resize:none}.ex{border-top:1px solid var(--line);padding:6px 0}.li input.tx{flex:1}.li.done input.tx{text-decoration:line-through;color:var(--mut)}.cf{background:var(--acc2);border-radius:8px;padding:8px;margin-top:8px}
.tv{color:var(--mut);font-size:13px;margin:2px 0 2px 14px;padding:2px 0 2px 10px;border-left:2px dashed var(--line)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;text-decoration:none;display:inline-block}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.d{color:var(--del)}
.zone{min-height:44px;border-radius:12px}
.bak{border:2px dashed var(--line);padding:6px;margin-top:10px}
.sec{font-weight:700;margin:10px 0 2px;font-size:13px;color:var(--mut)}
.li{display:flex;gap:8px;align-items:center;padding:3px 0}.li.done span{text-decoration:line-through;color:var(--mut)}
.li span{flex:1}.tag{font-size:12px;background:var(--acc2);border-radius:6px;padding:1px 6px}
.tot{font-size:20px;font-weight:700;color:var(--tm)}
.empty{color:var(--mut);text-align:center;padding:10px;font-size:13px}
</style></head><body>

  <div class="sec">🍜🛍 待點／待買</div>${x.todo.map((a,k)=>todoRow(a,x.id,k)).join('')}
  <div class="row"><select id="tk${x.id}"><option>餐點</option><option>物品</option></select><input id="tt${x.id}" style="flex:1" placeholder="例：味噌拉麵" onkeydown="if(event.key==='Enter')addTodo('${x.id}')"><button class="btn p" ${pn} onclick="addTodo('${x.id}')">加</button></div>
  <div class="sec">💴 這個景點的花費</div>${x.exp.map((a,k)=>exRow(a,x.id,k,'')).join('')}
  ${expForm('e',x.id)}
  <div class="row" style="margin-top:10px"><button class="btn" onclick="sw('${x.id}',-1)">▲</button><button class="btn" onclick="sw('${x.id}',1)">▼</button><button class="btn" onclick="mv('${x.id}')">${bk?'移回行程':'移到備案'}</button><button class="btn d" onclick="cf='${x.id}';render()">刪除景點</button></div>
  ${cf===x.id?`<div class="cf">確定要刪除「${esc(x.name)||'未命名'}」嗎？<div class="row"><button class="btn p" onclick="rm('${x.id}')">是，刪除</button><button class="btn" onclick="cf=null;render()">否</button></div></div>`:''}`}
 return h+'</div>'}
function expForm(p,id){return `<div class="row"><input id="${p}n${id}" placeholder="項目（例：一蘭拉麵）" style="width:100%"></div>
 <div class="row"><input id="${p}a${id}" type="number" inputmode="decimal" placeholder="金額" style="width:90px"><select id="${p}u${id}"><option value="JPY">日圓</option><option value="TWD">台幣</option></select><select id="${p}p${id}"><option>信用卡</option><option>現金</option></select><select id="${p}c${id}">${C.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn p" ${pn} onclick="${p==='e'?`addExp('${id}')`:'addG()'}">加</button></div>`}
function readExp(p,id){const f=$(p+'a'+id),a=+f.value;if(!a){f.focus();f.style.borderColor='var(--acc)';return null}return{n:$(p+'n'+id).value.trim()||'未命名',a,cur:$(p+'u'+id).value,pay:$(p+'p'+id).value,c:$(p+'c'+id).value}}
function addExp(id){const e=readExp('e',id);if(!e)return;find(id).exp.push(e);save();render()}
function addG(){const e=readExp('g','');if(!e)return;S.gx.push(e);save();render()}
function addDay(){S.days.push({date:'',start:'09:00',items:[],backup:[]});di=S.days.length-1;save();render()}
function addItem(){const x={id:uid(),name:'',place:'',dur:60,th:'',tm:20,tnote:'',note:'',links:[],todo:[],exp:[]};D().items.push(x);op[x.id]=true;save();render()}
function mv(id){const d=D(),a=d.items.findIndex(i=>i.id===id);if(a>=0)d.backup.push(d.items.splice(a,1)[0]);else{const b=d.backup.findIndex(i=>i.id===id);d.items.push(d.backup.splice(b,1)[0])}save();render()}
function sw(id,dir){const d=D();for(const arr of[d.items,d.backup]){const i=arr.findIndex(x=>x.id===id);if(i>=0){const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render();return}}}
function rm(id){const d=D();d.items=d.items.filter(i=>i.id!==id);d.backup=d.backup.filter(i=>i.id!==id);cf=null;save();render()}
function del(id,k,i){ed.clear();find(id)[k].splice(i,1);save();render()}
function tg(id,i){const a=find(id).todo[i];a.done=!a.done;save();render()}
function addLink(id){const f=$('lu'+id);let u=f.value.trim();if(!u){f.focus();f.style.borderColor='var(--acc)';return}if(!/^https?:/.test(u))u='https://'+u;find(id).links.push({t:$('lt'+id).value.trim(),u});save();render()}
function addTodo(id){const f=$('tt'+id),t=f.value.trim();if(!t){f.focus();f.style.borderColor='var(--acc)';return}find(id).todo.push({t,k:$('tk'+id).value,done:false});save();render()}
function dr(e){e.preventDefault();const h=e.currentTarget,card=h.closest('.card'),y0=e.clientY;let tgt=null,after=false;
 card.classList.add('drag');h.setPointerCapture(e.pointerId);
 const clr=()=>document.querySelectorAll('.ta,.tb,.tz').forEach(n=>n.classList.remove('ta','tb','tz'));
 const mvf=ev=>{card.style.transform=`translateY(${ev.clientY-y0}px)`;clr();card.style.pointerEvents='none';const el=document.elementFromPoint(ev.clientX,ev.clientY);card.style.pointerEvents='';tgt=null;if(!el)return;
  const o=el.closest('.card');
  if(o&&o!==card){const r=o.getBoundingClientRect();after=ev.clientY>=r.top+r.height/2;o.classList.add(after?'ta':'tb');tgt=o}
  else if(!o){const z=el.closest('.bak')?$('z-bak'):el.closest('.zone');if(z){z.classList.add('tz');tgt=z}}};
 const end=ok=>{h.removeEventListener('pointermove',mvf);h.removeEventListener('pointerup',upf);h.removeEventListener('pointercancel',cnf);
  if(ok&&tgt){const d=D(),id=card.dataset.id,x=[...d.items,...d.backup].find(i=>i.id===id);d.items=d.items.filter(i=>i!==x);d.backup=d.backup.filter(i=>i!==x);
   if(tgt.classList.contains('zone'))(tgt.id==='z-bak'?d.backup:d.items).push(x);
   else{const tid=tgt.dataset.id,arr=d.items.some(i=>i.id===tid)?d.items:d.backup,k=arr.findIndex(i=>i.id===tid);arr.splice(k+(after?1:0),0,x)}
   save()}
  render()};
 const upf=()=>end(true),cnf=()=>end(false);
 h.addEventListener('pointermove',mvf);h.addEventListener('pointerup',upf);h.addEventListener('pointercancel',cnf)}
function vList(){
 let h=`<div class="row"><button class="chip ${flt?'':'on'}" onclick="flt=0;render()">全部</button><button class="chip ${flt?'on':''}" onclick="flt=1;render()">只看未完成</button></div>`,n=0;
 S.days.forEach((d,k)=>[['items',''],['backup','（備案）']].forEach(([key,lb])=>d[key].forEach(x=>{
  const l=x.todo.map((a,ix)=>[a,ix]).filter(p=>!flt||!p[0].done||ed.has(`t:${x.id}:${p[1]}`));if(!l.length)return;n++;
  h+=`<div class="card"><b>Day ${k+1} · ${esc(x.name)||'未命名'}${lb}</b>${l.map(p=>todoRow(p[0],x.id,p[1])).join('')}</div>`})));
 return h+(n?'':'<div class="empty">還沒有待點／待買項目。到「行程」展開景點新增。</div>')}
function allExp(){const r=S.gx.map((a,i)=>({...a,src:'通用',id:'',k:i}));S.days.forEach((d,i)=>d.items.forEach(x=>x.exp.forEach((a,k)=>r.push({...a,src:'Day '+(i+1)+' '+(x.name||'景點'),id:x.id,k}))));return r}
function vCost(){
 const all=allExp(),f=all.filter(a=>sel.has(a.c)),rt=+S.rate||0;
 const tw=l=>l.reduce((q,a)=>q+(a.cur==='TWD'?a.a:a.a*rt),0);
 return `<div class="row">${C.map(c=>`<button class="chip ${sel.has(c)?'on':''}" onclick="sel.has('${c}')?sel.delete('${c}'):sel.add('${c}');render()">${c}</button>`).join('')}</div>
 <div class="row"><button class="btn" onclick="sel=new Set(C);render()">全選</button><button class="btn" onclick="sel=new Set();render()">全不選</button></div>
 <div class="card"><div class="sub">已選類別合計</div><div class="tot">${sumFull(f)}</div>
 <div class="row"><span class="sub">匯率 1日圓 =</span><input class="n" type="number" step="0.001" value="${S.rate}" onchange="S.rate=this.value;save();dq()"><span class="sub">台幣</span></div>
 <div style="font-size:18px;margin:4px 0"><b>折合台幣共 ${rt||!f.some(a=>a.cur!=='TWD')?'NT$'+Math.round(tw(f)).toLocaleString():'（請先填匯率）'}</b></div>
 <div class="sub">${C.map(c=>`${c} ${sumFull(all.filter(a=>a.c===c))}`).join('<br>')}</div>
 <div class="sub" style="margin-top:6px">信用卡 ${sumFull(f.filter(a=>(a.pay||'信用卡')==='信用卡'))}<br>現金 ${sumFull(f.filter(a=>a.pay==='現金'))}</div></div>
 <div class="card">${f.map(a=>exRow(a,a.id,a.k,a.src)).join('')||'<div class="empty">沒有符合的花費</div>'}</div>
 <div class="sec">新增通用花費（機票、住宿等）</div>${expForm('g','')}`}
function bk(){showBk=!showBk;arm=false;if(!showBk){render();return}
 $('v').innerHTML=`<div class="card"><div class="sec" style="margin-top:0">匯出（給朋友或換手機）</div><div class="sub">按下按鈕才會複製目前的行程，不會自動蓋掉你剪貼簿裡的內容。</div><div id="bm0" class="sub"></div><textarea id="ex" readonly style="display:none;min-height:90px;overflow:auto"></textarea><div class="row"><button class="btn p" onclick="mk()">複製目前行程</button></div></div>
 <div class="card"><div class="sec" style="margin-top:0">匯入</div><div class="sub">把備份文字貼到下面，按「匯入」。匯入會覆蓋目前資料。</div><textarea id="bx" oninput="arm=false" placeholder="在這裡貼上備份文字" style="min-height:110px;overflow:auto"></textarea><div id="bm" class="sub"></div><div class="row"><button class="btn p" onclick="imp()">匯入</button><button class="btn" onclick="$('bx').value='';arm=false;$('bm').textContent=''">清空</button><button class="btn" onclick="showBk=false;render()">返回</button></div></div>`}
const enc=t=>{const c='JT2:'+LZString.compressToEncodedURIComponent(t);return c.length<t.length?c:t};
async function dec(t){const raw=String(t).replace(/[\u200B-\u200D\uFEFF]/g,'').trim(),m=raw.match(/JT([12]):([\s\S]*)$/);if(!m)return JSON.parse(raw);const b=m[2].replace(/\s/g,'');
 if(m[1]==='2'){const x=LZString.decompressFromEncodedURIComponent(b);if(!x)throw new Error('bad');return JSON.parse(x)}
 if(typeof DecompressionStream==='undefined')throw new Error('old');
 try{const n=atob(b),u=Uint8Array.from(n,c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}catch(e){throw new Error('old')}}
function mk(){const raw=JSON.stringify(S),p=Promise.resolve(enc(raw)),b=$('bm0'),e=$('ex');
 const m=t=>t===raw?'共 '+raw.length.toLocaleString()+' 字（內容較少，不需壓縮）':'共 '+t.length.toLocaleString()+' 字（壓縮前 '+raw.length.toLocaleString()+' 字）';
 const ok=t=>{e.style.display='none';b.textContent='✅ 已複製，'+m(t)},no=t=>{e.style.display='block';e.value=t;e.focus();e.select();b.textContent=m(t)+'。自動複製沒成功，請長按下方文字選「全選」再拷貝'};
 const fb=t=>{try{e.style.display='block';e.value=t;e.select();document.execCommand('copy')?ok(t):no(t)}catch(x){no(t)}};
 try{if(window.ClipboardItem){navigator.clipboard.write([new ClipboardItem({'text/plain':p.then(t=>new Blob([t],{type:'text/plain'}))})]).then(()=>p.then(ok),()=>p.then(fb));return}}catch(x){}
 p.then(t=>{try{navigator.clipboard.writeText(t).then(()=>ok(t),()=>fb(t))}catch(x){fb(t)}})}
async function imp(){const bm=$('bm');try{if(!$('bx').value.trim()){bm.textContent='請先貼上備份文字';return}const o=await dec($('bx').value);if(!o.days)throw 0;
 if(!arm){arm=true;const ni=o.days.reduce((q,d)=>q+(d.items||[]).length+(d.backup||[]).length,0);bm.textContent='這份備份有 '+o.days.length+' 天、'+ni+' 個景點。再按一次「匯入」確認覆蓋目前資料';return}
 S=mig(o);di=0;tab='trip';save();showBk=false;render()}catch(e){bm.textContent=e&&e.message==='old'?'這是舊版壓縮格式，這個瀏覽器解不開。請回到有資料的頁面，重新按「備份／分享」複製新格式':'格式不正確，請確認完整貼上（'+(e&&e.message||e)+'）'}}
const rl=(p,x)=>{const ok=q=>q&&!/^https?:/.test(q.trim());return ok(p.place)&&ok(x.place)?`<a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(p.place)}&destination=${encodeURIComponent(x.place)}&travelmode=transit">查路線</a>`:''};
const exRow=(a,id,k,src)=>{const key=`e:${id}:${k}`,r=`'${id}',${k}`;if(ed.has(key)&&dc===key)return cfm(a.n,`dx(${r})`);if(!ed.has(key))return `<div class="li"><span>${esc(a.n)}<div class="sub">${src?esc(src)+' · ':''}${a.pay||'信用卡'}</div></span><em class="tag">${a.c}</em><b>${mny(a)}</b><button class="btn" onclick="te('${key}')">✏️</button></div>`;return `<div class="ex"><div class="row"><input style="flex:1" value="${esc(a.n)}" oninput="ue(${r},'n',this.value)"><button class="btn p" onclick="te('${key}')">✓</button><button class="btn d" onclick="dc='${key}';render()">✕</button></div>${src?`<div class="sub">${esc(src)}</div>`:''}<div class="row"><input type="number" inputmode="decimal" style="width:90px" value="${a.a}" onchange="ue(${r},'a',+this.value);dq()"><select onchange="ue(${r},'cur',this.value);render()"><option value="JPY" ${a.cur!=='TWD'?'selected':''}>日圓</option><option value="TWD" ${a.cur==='TWD'?'selected':''}>台幣</option></select><select onchange="ue(${r},'pay',this.value);render()">${['信用卡','現金'].map(p=>`<option ${(a.pay||'信用卡')===p?'selected':''}>${p}</option>`).join('')}</select><select onchange="ue(${r},'c',this.value);render()">${C.map(c=>`<option ${a.c===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="sub">${mny(a)}</div></div>`};
function ue(id,k,f,v){(id?find(id).exp:S.gx)[k][f]=v;save()}
function dx(id,k){ed.clear();(id?find(id).exp:S.gx).splice(k,1);save();render()}
function ut(id,k,f,v){find(id).todo[k][f]=v;save()}
let dirty=false;const dq=()=>{dirty=true};
document.addEventListener('focusout',e=>{if(dirty&&!e.relatedTarget)setTimeout(()=>{if(dirty&&!document.activeElement.matches('input,textarea,select')){dirty=false;render()}},60)});
render();
</script></body></html>
